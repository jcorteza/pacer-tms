name: pacer-tms

services:
    db:
        image: postgres:18
        restart: always
        # set shared memory limit when using docker compose
        shm_size: 128mb
        volumes:
            - pg-data:/var/lib/postgresql
        env_file: .env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d pacer"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - api

    backend:
        build: ./backend
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        # healthcheck:
        #     test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
        #     interval: 5s
        #     timeout: 5s
        #     retries: 5
        networks:
            - api

    frontend:
        build: ./frontend
        # depends_on:
        #     - backend:
        #         condition: healthcheck
        ports:
            - "5173:5173"
        networks:
            - ui
        profiles:
            - frontend

volumes:
    pg-data:

networks:
    api:
    ui: